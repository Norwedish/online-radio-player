services:
  icecast:
    image: moul/icecast:latest
    container_name: radio-icecast-dev
    ports:
      - "8000:8000"
    volumes:
      - ./config/icecast.dev.xml:/etc/icecast2/icecast.xml:ro
    restart: unless-stopped

  # M0.6 finding: upstream Icecast (2.4.4 and 2.5.0) has no HLS support, so HLS
  # segments are produced by FFmpeg and served statically by nginx.
  nginx-hls:
    image: nginx:alpine
    container_name: radio-nginx-hls-dev
    ports:
      - "8081:8081"
    volumes:
      - ./data/spike/hls:/usr/share/nginx/html/hls:ro
      - ./config/nginx.hls.dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

# Note: moul/icecast may ship Icecast 2.4.x. HLS verification (M0.6) may need a
# 2.5/2.6 image or a native Debian package; document the result in the ADR.
